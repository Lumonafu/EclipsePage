<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse Launcher</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="shadow"></div>
<div id="light"></div>

<header>
    <img src="img/logo.png" alt="Logo" class="logo">

</header>

<main>

    <div class="parallax-container">

        <img
            src="img/heroes.png"
            alt=""
            class="parallax-layer"
            id="parallax">

    </div>

    <section class="hero">

        <img src="img/eclipse-logo.png" alt="Eclipse" class="hero-logo">

        <button class="download-btn">
            Descargar para Windows
        </button>

        <a href="#" class="linux-link">
            Descarga alternativa para Linux
        </a>

    </section>

</main>

<script src="js/script.js"></script>

</body>
</html>
